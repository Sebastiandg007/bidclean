name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# ─────────────────────────────────────────────────────────────────────────────
# Monorepo CI Strategy:
# Each job installs ONLY the workspace slice it needs.
# This avoids native dependency compilation issues (sharp, mapbox, expo)
# and keeps jobs fast (~30s instead of ~3min).
#
# Mobile validation is handled by Codemagic (native builds + EAS).
# GitHub Actions handles: API lint/typecheck/test + AI service tests.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  api-quality:
    name: API — Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install only API + shared workspace deps (no mobile native modules)
      - name: Install dependencies
        run: npm ci --workspace=services/api --workspace=packages/shared --include-workspace-root

      - name: Typecheck API
        working-directory: services/api
        run: npx tsc --noEmit

      - name: Typecheck Shared
        working-directory: packages/shared
        run: npx tsc --noEmit

      - name: Lint API
        working-directory: services/api
        run: npx eslint "src/**/*.ts" --max-warnings 0

  api-tests:
    name: API — Tests
    runs-on: ubuntu-latest
    needs: api-quality
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bidclean_test
          POSTGRES_USER: bidclean
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=services/api --workspace=packages/shared --include-workspace-root

      - name: Run API tests
        working-directory: services/api
        run: npx jest --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://bidclean:test@localhost:5432/bidclean_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  ai-tests:
    name: AI Service — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: services/ai
        run: poetry install --no-root

      - name: Run AI tests
        working-directory: services/ai
        run: poetry run pytest -v
