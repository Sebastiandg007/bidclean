name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # API — typecheck (most critical gate)
      - name: Typecheck API
        working-directory: services/api
        run: npx tsc --noEmit

      # Shared — typecheck
      - name: Typecheck Shared
        working-directory: packages/shared
        run: npx tsc --noEmit

      # Lint — run from root using the flat config (covers all workspaces)
      - name: Lint
        run: npx eslint "services/api/src/**/*.ts" "packages/shared/src/**/*.ts" --max-warnings 0
        continue-on-error: true

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bidclean_test
          POSTGRES_USER: bidclean
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run API Tests
        working-directory: services/api
        run: npx jest --passWithNoTests
        env:
          DATABASE_URL: postgresql://bidclean:test@localhost:5432/bidclean_test
          REDIS_URL: redis://localhost:6379

  test-ai:
    name: Test AI Service
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        working-directory: services/ai
        run: poetry install
      - name: Run tests
        working-directory: services/ai
        run: poetry run pytest
