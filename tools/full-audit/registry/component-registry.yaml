    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.worker }
    integrationProbe: { probeType: external-integration, probeId: ext.onesignal }

  - componentId: api.worker.revenuecat-webhook
    owner: revenuecat-subscriptions
