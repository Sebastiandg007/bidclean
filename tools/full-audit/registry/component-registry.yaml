  # ---------------------------------------------------------------------------
  # API BullMQ workers / processors (real queue names in *.constants.ts)
  # ---------------------------------------------------------------------------
  - componentId: api.worker.radius-expansion
    owner: offer-radar
    surface: API
    entryPoint: BullMQ queue 'offer-radius-expansion' (RadiusExpansionProcessor)
    dependencies: [svc.redis, svc.postgres]
    consumes: [{ eventName: expand-radius, channel: offer-radius-expansion }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.worker }
    integrationProbe: { probeType: inter-service-edge, probeId: edge.api-redis-bullmq }

  - componentId: api.worker.tier-delivery
    owner: offer-radar
    surface: API
    entryPoint: BullMQ queue 'offer-tier-delivery' (TierDeliveryProcessor)
    dependencies: [svc.redis]
    consumes: [{ eventName: deliver-to-tier, channel: offer-tier-delivery }]
    produces: [{ eventName: offer.matched, channel: offer_outbox }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.worker }
    integrationProbe: { probeType: inter-service-edge, probeId: edge.api-redis-bullmq }

  - componentId: api.worker.favorites-window
    owner: favorites
