    healthProbe: { probeType: component-presence, probeId: presence.worker }
    integrationProbe: { probeType: inter-service-edge, probeId: edge.api-ai-transcribe }

  # ---------------------------------------------------------------------------
  # API outbox relay + durable event consumers (real event strings)
  # ---------------------------------------------------------------------------
  - componentId: api.relay.notifications-outbox
    owner: push-notifications
    surface: API
    entryPoint: "@Interval OutboxRelayProcessor (offer/payment/negotiation/chat/voip _outbox)"
    dependencies: [svc.postgres]
    consumes:
      - { eventName: offer.matched, channel: offer_outbox }
      - { eventName: offer.cancelled, channel: offer_outbox }
      - { eventName: offer.expired, channel: offer_outbox }
      - { eventName: offer.completed, channel: offer_outbox }
    produces: [{ eventName: delivery-intent, channel: notifications-delivery }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.consumer }
    integrationProbe: { probeType: inter-service-edge, probeId: edge.outbox-push }

  - componentId: api.listener.offer-matched-escrow
    owner: stripe-escrow
    surface: API
    entryPoint: "@OnEvent(offer.matched) OfferMatchedListener → EscrowChargeService"
    dependencies: [api.module.offers, api.module.payments]
    consumes: [{ eventName: offer.matched }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.consumer }
    integrationProbe: { probeType: live-journey, probeId: chain.offer-matched-escrow }

  - componentId: api.consumer.service-activation
    owner: service-tracking
    surface: API
    entryPoint: "@Interval ServiceActivationConsumer (service_activation_outbox)"
    dependencies: [svc.postgres]
    consumes: [{ eventName: service_activation_ready, channel: service_activation_outbox }]
    produces: [{ eventName: service_arrived, channel: service_outbox }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.consumer }
    integrationProbe: { probeType: live-journey, probeId: chain.activation-session }

  - componentId: api.consumer.verification-arrival
    owner: video-verification
    surface: API
    entryPoint: "@Interval VerificationArrivalConsumer (service_outbox, consumer_name=video)"
    dependencies: [svc.postgres]
    consumes: [{ eventName: service_arrived, channel: service_outbox }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.consumer }
    integrationProbe: { probeType: live-journey, probeId: chain.arrival-verification }

  - componentId: api.consumer.completion-created
    owner: service-completion
    surface: API
    entryPoint: "@Interval CompletionCreatedConsumer (checklist_outbox, consumer_name=completion)"
    dependencies: [svc.postgres]
    consumes: [{ eventName: checklist_completed, channel: checklist_outbox }]
    produces: [{ eventName: service_disputed, channel: completion_outbox }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.consumer }
    integrationProbe: { probeType: live-journey, probeId: chain.checklist-completion }

  - componentId: api.consumer.dispute-created
    owner: dispute-system
    surface: API
    entryPoint: "@Interval DisputeCreatedConsumer (completion_outbox, consumer_name=dispute)"
    dependencies: [svc.postgres]
    consumes: [{ eventName: service_disputed, channel: completion_outbox }]
    requiredInEnvironment: both
    healthProbe: { probeType: component-presence, probeId: presence.consumer }
    integrationProbe: { probeType: live-journey, probeId: chain.dispute-routing }

