# =============================================================================
# BidClean deployment-readiness component registry (versioned)
# =============================================================================
# The checkable definition of "every component". Authoritative for "what must
# exist and be wired" — a component is "real" only because it is declared here.
# Covers top-level services/infra AND the internal modules that can be "up but
# unwired" (Nest modules, BullMQ workers, outbox/event consumers, scheduled
# jobs, webhook ingresses, AI endpoints, mobile feature modules).
#
# Event-driven entries declare `consumes`/`produces`: those declared events are
# exactly what the integrationProbe verifies end-to-end on the running system.
# Event name strings are the REAL strings in services/api/src (verified against
# code), not invented.
#
# Reconcile this file against the owning specs / docs/ARCHITECTURE.md BEFORE
# every audit (see READINESS-RUNBOOK.md). A divergence is a blocking
# REGISTRY_STALE finding.
# =============================================================================
version: 1

components:
  # ---------------------------------------------------------------------------
  # Top-level services + infrastructure (the audited-topology diagram)
  # ---------------------------------------------------------------------------
  - componentId: svc.api
    owner: services/api
    surface: API
    entryPoint: https://api.bidclean.tech (NestJS HTTP)
    dependencies: [svc.postgres, svc.redis, svc.minio, svc.keycloak]
    requiredInEnvironment: both
    healthProbe: { probeType: service-health, probeId: health.api }
    integrationProbe: { probeType: component-presence, probeId: presence.api }

  - componentId: svc.ai
    owner: services/ai
    surface: AI
    entryPoint: FastAPI (uvicorn) /health
    dependencies: []
