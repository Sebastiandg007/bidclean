[tool.poetry]
name = "bidclean-ai"
version = "0.1.0"
description = "BidClean AI/ML microservice — verification, translation, speech, pricing"
authors = ["BidClean Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
python-multipart = "^0.0.9"
numpy = "^1.26.0"
opencv-python-headless = "^4.9.0"
Pillow = "^10.4.0"

[tool.poetry.group.ml.dependencies]
paddleocr = "^2.7.0"
paddlepaddle = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
hypothesis = "^6.100.0"
httpx = "^0.27.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses function calls (Depends, File, Header, Query) in parameter defaults by design
"src/kyc/router.py" = ["B008"]
"src/kyc/auth.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
